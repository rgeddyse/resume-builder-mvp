<!-- template:name=Geometric Pattern; style=Modern resume with geometric dot and grid pattern background; source_note=Contemporary geometric design with professional patterns -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --accent: {{accent}}; --secondary: {{secondary}}; --font: {{font}}; }
    * { box-sizing: border-box; }
    body { margin: 0; {{page_background}} color: #1f2937; font-family: var(--font), Arial, sans-serif; font-size: 14px; line-height: 1.5; }
    .page { max-width: 880px; min-height: 1120px; margin: 20px auto; {{paper_background}} box-shadow: 0 18px 42px rgba(15, 23, 42, .12); padding: 38px 44px; position: relative; }
    header { text-align: center; border-bottom: 3px solid var(--accent); padding-bottom: 18px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 36px; line-height: 1.03; color: #111827; letter-spacing: 0; }
    .title { margin-top: 8px; color: var(--accent); font-weight: 800; }
    .contact { margin-top: 12px; color: #4b5563; font-size: 12px; }
    h2 { margin: 24px 0 10px; color: #111827; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
    h2::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--secondary); margin-right: 10px; transform: rotate(45deg); }
    h3 { margin: 0 0 5px; color: var(--accent); font-size: 15px; }
    .item { margin-bottom: 15px; padding-left: 20px; border-left: 3px solid color-mix(in srgb, var(--secondary) 30%, white); }
    ul { margin: 7px 0 0 18px; padding: 0; }
    li { margin-bottom: 5px; }
    .skill { display: inline-block; background: white; border: 2px solid var(--secondary); border-radius: 4px; padding: 5px 10px; margin: 0 5px 7px 0; font-size: 12px; font-weight: 700; }
    .compact .item { margin-bottom: 9px; }
    @media print { body { background: #fff; } .page { margin: 0; box-shadow: none; max-width: none; } .page::before { display: none; } }
    @media (max-width: 720px) { .page { margin: 0; padding: 28px; } }
  </style>
</head>
<body>
  <div class="page {{density}}">
    <header>
      <h1>{{name}}</h1>
      <div class="title">{{title}}</div>
      <div class="contact">{{contact}}</div>
    </header>
    {{summary_section}}
    {{skills_section}}
    {{experience_section}}
    {{projects_section}}
    {{education_section}}
    {{certifications_section}}
    {{languages_section}}
    {{awards_section}}
  </div>
</body>
</html>
