<!-- template:name=Clean ATS; style=Simple parser-friendly format; source_note=Original local print-focused template -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --accent: {{accent}}; --secondary: {{secondary}}; --font: {{font}}; }
    * { box-sizing: border-box; }
    body { margin: 0; {{page_background}} color: #202124; font-family: var(--font), Arial, sans-serif; font-size: 14px; line-height: 1.46; }
    .page { width: 850px; margin: 18px auto; padding: 34px 46px; {{paper_background}} }
    header { text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 15px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 30px; color: #111827; letter-spacing: 0; }
    .title { margin-top: 6px; color: var(--accent); font-weight: 700; }
    .contact { margin-top: 8px; color: #4b5563; font-size: 12px; }
    h2 { color: var(--accent); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid #d1d5db; padding-bottom: 4px; margin: 20px 0 9px; }
    h3 { margin: 0 0 4px; font-size: 15px; color: #111827; }
    .item { margin-bottom: 13px; }
    ul { margin: 6px 0 0 18px; padding: 0; }
    li { margin-bottom: 4px; }
    .skill { display: inline; font-weight: 700; }
    .skill::after { content: "  "; }
    .compact .item { margin-bottom: 8px; }
    @media print { .page { margin: 0; max-width: none; } }
    @media (max-width: 680px) { .page { padding: 25px; } }
  </style>
</head>
<body>
  <div class="page {{density}}">
    <header>
      <h1>{{name}}</h1>
      <div class="title">{{title}}</div>
      <div class="contact">{{contact}}</div>
    </header>
    {{summary_section}}
    {{skills_section}}
    {{experience_section}}
    {{projects_section}}
    {{education_section}}
    {{certifications_section}}
    {{languages_section}}
    {{awards_section}}
  </div>
</body>
</html>
