<!-- template:name=Pastel Split; style=Soft split resume with left information rail; source_note=Original local template based on current image-search layout patterns -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --accent: {{accent}}; --secondary: {{secondary}}; --font: {{font}}; }
    * { box-sizing: border-box; }
    body { margin: 0; {{page_background}} color: #1f2937; font-family: var(--font), Arial, sans-serif; font-size: 14px; line-height: 1.5; }
    .page { max-width: 900px; min-height: 1120px; margin: 20px auto; {{paper_background}} display: grid; grid-template-columns: 35% 1fr; box-shadow: 0 20px 45px rgba(15, 23, 42, .12); }
    .rail { background: color-mix(in srgb, var(--secondary) 18%, white); padding: 38px 28px; border-right: 1px solid color-mix(in srgb, var(--accent) 18%, white); }
    .main { padding: 38px 44px 44px; }
    .avatar { min-width: 74px; min-height: 74px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--secondary)); margin: 0 auto 20px; box-shadow: inset 0 0 0 9px rgba(255,255,255,.72); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .profile-photo { width: 100%; height: 100%; object-fit: cover; }
    h1 { margin: 0; font-size: 32px; line-height: 1.05; letter-spacing: 0; color: #111827; }
    .title { margin-top: 8px; color: var(--accent); font-weight: 800; }
    h2 { color: #111827; font-size: 13px; text-transform: uppercase; letter-spacing: .09em; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 2px solid color-mix(in srgb, var(--secondary) 42%, white); }
    .rail h2 { color: var(--accent); }
    h3 { margin: 0 0 5px; color: var(--accent); font-size: 15px; }
    .contact { display: grid; gap: 8px; font-size: 12px; word-break: break-word; }
    .item { margin-bottom: 15px; }
    ul { margin: 7px 0 0 18px; padding: 0; }
    li { margin-bottom: 5px; }
    .skill { display: block; background: rgba(255, 255, 255, .78); border-radius: 6px; padding: 5px 8px; margin: 0 0 7px; border-left: 4px solid var(--secondary); font-size: 12px; }
    .main .skill { display: inline-block; margin-right: 6px; border: 1px solid color-mix(in srgb, var(--secondary) 42%, white); border-left-width: 4px; }
    .compact .item { margin-bottom: 9px; }
    @media print { body { background: #fff; } .page { margin: 0; box-shadow: none; max-width: none; } }
    @media (max-width: 760px) { .page { grid-template-columns: 1fr; margin: 0; } .rail, .main { padding: 28px; } .rail { text-align: center; } }
  </style>
</head>
<body>
  <div class="page {{density}}">
    <aside class="rail">
      <div class="avatar">{{profile_photo}}</div>
      <h2>Contact</h2>
      <div class="contact">{{contact_items}}</div>
      {{skills_section}}
      {{education_section}}
      {{languages_section}}
      {{certifications_section}}
    </aside>
    <main class="main">
      <h1>{{name}}</h1>
      <div class="title">{{title}}</div>
      {{summary_section}}
      {{experience_section}}
      {{projects_section}}
      {{awards_section}}
    </main>
  </div>
</body>
</html>
