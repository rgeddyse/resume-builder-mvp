<!-- template:name=Gradient Sidebar; style=Modern gradient sidebar with clean main content; source_note=Modern gradient design inspired by contemporary resume trends -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --accent: {{accent}}; --secondary: {{secondary}}; --font: {{font}}; }
    * { box-sizing: border-box; }
    body { margin: 0; {{page_background}} color: #1f2937; font-family: var(--font), Arial, sans-serif; font-size: 14px; line-height: 1.5; }
    .page { width: 900px; min-height: 1120px; margin: 20px auto; {{paper_background}} display: grid; grid-template-columns: 32% 1fr; box-shadow: 0 18px 45px rgba(15, 23, 42, .14); overflow: hidden; }
    aside { background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--secondary) 40%, var(--accent))); color: white; padding: 36px 28px; min-width: 0; }
    main { padding: 36px 42px; min-width: 0; }
    .profile-section { text-align: center; margin-bottom: 20px; }
    .profile-photo-container { min-width: 80px; min-height: 80px; border-radius: 50%; background: rgba(255,255,255,0.2); margin: 0 auto 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.3); }
    .profile-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 { margin: 0; font-size: 32px; line-height: 1.05; letter-spacing: 0; color: #111827; }
    .title { margin-top: 10px; color: var(--accent); font-weight: 800; }
    .contact { margin-top: 24px; display: grid; gap: 10px; font-size: 12px; word-break: break-word; opacity: .95; }
    h2 { color: #111827; font-size: 13px; margin: 24px 0 10px; text-transform: uppercase; letter-spacing: .08em; border-bottom: 2px solid rgba(37, 99, 235, .15); padding-bottom: 6px; }
    aside h2 { color: white; border-color: rgba(255, 255, 255, .3); }
    h3 { margin: 0 0 5px; color: var(--accent); font-size: 15px; }
    aside h3 { color: white; }
    .item { margin-bottom: 15px; }
    ul { margin: 7px 0 0 18px; padding: 0; }
    li { margin-bottom: 5px; }
    .skill { display: inline-block; background: rgba(255, 255, 255, .9); border-radius: 999px; padding: 4px 10px; margin: 0 4px 6px 0; font-size: 12px; color: #1f2937; }
    main .skill { background: color-mix(in srgb, var(--secondary) 18%, white); border: 1px solid color-mix(in srgb, var(--secondary) 42%, white); color: #1f2937; }
    .compact .item { margin-bottom: 9px; }
    @media print { body { background: #fff; } .page { margin: 0; box-shadow: none; max-width: none; } }
    @media (max-width: 760px) { .page { grid-template-columns: 1fr; margin: 0; } aside, main { padding: 28px; } .profile-section { text-align: center; } .profile-photo-container { margin: 0 auto 15px; } }
  </style>
</head>
<body>
  <div class="page {{density}}">
    <aside>
      <div class="profile-section">
        <div class="profile-photo-container">{{profile_photo}}</div>
      </div>
      <h2>Contact</h2>
      <div class="contact">{{contact_items}}</div>
      {{skills_section}}
      {{languages_section}}
      {{certifications_section}}
    </aside>
    <main>
      <h1>{{name}}</h1>
      <div class="title">{{title}}</div>
      {{summary_section}}
      {{experience_section}}
      {{projects_section}}
      {{education_section}}
      {{awards_section}}
    </main>
  </div>
</body>
</html>
