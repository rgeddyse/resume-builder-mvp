<!-- template:name=Concentric Circles; style=Artistic ATS-friendly template with decorative corner circles; source_note=ATS-friendly decorative template with CSS-based concentric circle ripples -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --accent: {{accent}}; --secondary: {{secondary}}; --font: {{font}}; }
    * { box-sizing: border-box; }
    body { margin: 0; {{page_background}} color: #1f2937; font-family: var(--font), Arial, sans-serif; font-size: 14px; line-height: 1.5; }
    .page { max-width: 870px; min-height: 1120px; margin: 20px auto; {{paper_background}} box-shadow: 0 18px 42px rgba(15, 23, 42, .12); padding: 42px 48px; position: relative; overflow: hidden; }
    .corner-decoration { position: absolute; width: 120px; height: 120px; border-radius: 50%; opacity: .15; pointer-events: none; }
    .corner-decoration::before, .corner-decoration::after { content: ""; position: absolute; border-radius: 50%; border: 2px solid var(--accent); }
    .corner-decoration::before { width: 40px; height: 40px; top: 20px; left: 20px; }
    .corner-decoration::after { width: 70px; height: 70px; top: 5px; left: 5px; }
    .top-right { top: 20px; right: 20px; }
    .bottom-left { bottom: 20px; left: 20px; }
    header { text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 16px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: 34px; line-height: 1.05; color: #111827; letter-spacing: 0; }
    .title { margin-top: 8px; color: var(--accent); font-weight: 800; }
    .contact { margin-top: 10px; color: #4b5563; font-size: 12px; }
    h2 { margin: 22px 0 10px; color: #111827; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
    h3 { margin: 0 0 5px; color: var(--accent); font-size: 15px; }
    .item { margin-bottom: 15px; }
    ul { margin: 7px 0 0 18px; padding: 0; }
    li { margin-bottom: 5px; }
    .skill { display: inline-block; background: color-mix(in srgb, var(--secondary) 15%, white); border: 1px solid color-mix(in srgb, var(--secondary) 40%, white); border-radius: 999px; padding: 4px 10px; margin: 0 4px 6px 0; font-size: 12px; }
    .compact .item { margin-bottom: 9px; }
    @media print { body { background: #fff; } .page { margin: 0; box-shadow: none; max-width: none; } .corner-decoration { display: none; } }
    @media (max-width: 720px) { .page { margin: 0; padding: 28px; } .corner-decoration { display: none; } }
  </style>
</head>
<body>
  <div class="page {{density}}">
    <div class="corner-decoration top-right" aria-hidden="true"></div>
    <div class="corner-decoration bottom-left" aria-hidden="true"></div>
    <header>
      <h1>{{name}}</h1>
      <div class="title">{{title}}</div>
      <div class="contact">{{contact}}</div>
    </header>
    {{summary_section}}
    {{skills_section}}
    {{experience_section}}
    {{projects_section}}
    {{education_section}}
    {{certifications_section}}
    {{languages_section}}
    {{awards_section}}
  </div>
</body>
</html>
