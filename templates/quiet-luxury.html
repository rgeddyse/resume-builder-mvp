<!-- template:name=Quiet Luxury; style=Premium minimal resume with muted panels and refined spacing; source_note=Original local professional template -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --accent: {{accent}}; --secondary: {{secondary}}; --font: {{font}}; }
    * { box-sizing: border-box; }
    body { margin: 0; {{page_background}} color: #1f2937; font-family: var(--font), Arial, sans-serif; font-size: 14px; line-height: 1.52; }
    .page { width: 870px; min-height: 1120px; margin: 20px auto; {{paper_background}} box-shadow: 0 20px 46px rgba(15,23,42,.12); padding: 42px 44px; overflow: hidden; }
    header { display: grid; grid-template-columns: 1fr 32%; gap: 30px; padding-bottom: 24px; border-bottom: 1px solid #e5e7eb; }
    .nameplate { padding-right: 20px; }
    .contact { background: #f5f7fa; border: 1px solid #e5e7eb; padding: 18px; display: grid; gap: 7px; font-size: 12px; word-break: break-word; }
    h1 { margin: 0; font-size: 37px; line-height: 1.03; color: #111827; letter-spacing: 0; }
    .title { margin-top: 10px; color: var(--accent); font-weight: 800; }
    .body { display: grid; grid-template-columns: 32% 1fr; gap: 34px; padding-top: 28px; }
    .side { border-right: 1px solid #e5e7eb; padding-right: 24px; }
    h2 { margin: 24px 0 10px; color: #111827; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
    h2::before { content: ""; display: inline-block; width: 10px; height: 10px; background: var(--secondary); margin-right: 8px; vertical-align: -1px; }
    .side h2:first-child, main h2:first-child { margin-top: 0; }
    h3 { margin: 0 0 5px; color: var(--accent); font-size: 15px; }
    .item { margin-bottom: 15px; }
    ul { margin: 7px 0 0 18px; padding: 0; }
    li { margin-bottom: 5px; }
    .skill { display: block; padding: 5px 0; border-bottom: 1px solid #e5e7eb; font-size: 12px; }
    main .skill { display: inline-block; border: 1px solid color-mix(in srgb, var(--secondary) 40%, white); border-radius: 4px; padding: 5px 8px; margin: 0 5px 7px 0; }
    .compact .item { margin-bottom: 9px; }
    @media print { body { background: #fff; } .page { margin: 0; box-shadow: none; max-width: none; } }
    @media (max-width: 760px) { .page { margin: 0; padding: 28px; } header, .body { grid-template-columns: 1fr; } .side { border-right: 0; padding-right: 0; } }
  </style>
</head>
<body>
  <div class="page {{density}}">
    <header>
      <div class="nameplate">
        <h1>{{name}}</h1>
        <div class="title">{{title}}</div>
      </div>
      <div class="contact">{{contact_items}}</div>
    </header>
    <div class="body">
      <aside class="side">
        {{skills_section}}
        {{education_section}}
        {{certifications_section}}
        {{languages_section}}
      </aside>
      <main>
        {{summary_section}}
        {{experience_section}}
        {{projects_section}}
        {{awards_section}}
      </main>
    </div>
  </div>
</body>
</html>
